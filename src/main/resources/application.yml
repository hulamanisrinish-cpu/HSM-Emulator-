spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/hsmdb
    username: hsm
    password: hsm_secret
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE

# HSM emulator configuration
hsm:
  master-key:
    # PBKDF2-HmacSHA256 iteration count (NIST SP 800-132 recommends >= 310,000 for SHA-256)
    iterations: 310000
    # Random salt length in bytes (128-bit salt)
    salt-length: 16
