version: "3.9"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: hsmdb
      POSTGRES_USER: hsm
      POSTGRES_PASSWORD: hsm_secret
    ports:
      - "5432:5432"
    volumes:
      - hsm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hsm -d hsmdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  hsm_pgdata:
